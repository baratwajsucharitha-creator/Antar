# Azure profile. Activated with SPRING_PROFILES_ACTIVE=azure in App Service settings.
#
# No credentials in this file, ever. The connection string arrives as an environment
# variable whose value is a Key Vault reference resolved by App Service using the
# app's managed identity - the app itself never holds a secret or a Key Vault client.

antar:
  auth:
    # In the cloud, a request without an Easy Auth principal is rejected.
    # Locally this stays false so development does not need a login.
    require-platform-principal: true
  catalogue:
    # On: Azure SQL has no catalogue data until this runs at least once, and
    # production needs the same seeded insurer/product dropdown as local dev.
    # Safe on every cold start (this app is on Free F1 and cold-starts often):
    # CatalogueImportService checks insurerRepository.count() > 0 before doing
    # anything else, per dataset - a single cheap SELECT COUNT(*), not a scan -
    # and skips the whole dataset once it's populated. Explicit here rather than
    # inherited from the base application.yml default, so this profile's real
    # behavior in production is never a silent consequence of what the local
    # default happens to be set to.
    import-on-startup: true

server:
  # App Service Linux injects PORT. 8080 keeps local runs identical.
  port: ${PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${ANTAR_DB_URL}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    # Blank out the default profile's sa/blank credentials so Hikari falls back to
    # the user/password embedded in ANTAR_DB_URL instead of overriding them.
    username:
    password:
    hikari:
      # The free-tier database auto-pauses when idle and takes a few seconds to wake.
      connection-timeout: 60000
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 120000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.antar: INFO
    org.springframework: WARN
