# Azure profile. Activated with SPRING_PROFILES_ACTIVE=azure in App Service settings.
#
# No credentials in this file, ever. The connection string arrives as an environment
# variable whose value is a Key Vault reference resolved by App Service using the
# app's managed identity - the app itself never holds a secret or a Key Vault client.

server:
  # App Service Linux injects PORT. 8080 keeps local runs identical.
  port: ${PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${ANTAR_DB_URL}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      # The free-tier database auto-pauses when idle and takes a few seconds to wake.
      connection-timeout: 60000
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 120000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.antar: INFO
    org.springframework: WARN
