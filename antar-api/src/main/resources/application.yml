spring:
  application:
    name: antar-api

  datasource:
    url: jdbc:h2:mem:antar;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the mapping agrees.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

antar:
  catalogue:
    # Off everywhere by default, including local dev - opt in explicitly
    # (e.g. -Dantar.catalogue.import-on-startup=true) when you want to load
    # the CSVs. See docs/data/README.md "Import behaviour" for why: this app
    # cold-starts often on a free-tier plan and free-tier DB, and an import
    # running on every cold start is pure waste once the tables are populated.
    import-on-startup: false
    # When a target table already has rows, import skips it unless this is true.
    import-force: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.antar: INFO
