spring:
  application:
    name: antar-api

  datasource:
    url: jdbc:h2:mem:antar;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the mapping agrees.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: true
      path: /h2-console

antar:
  catalogue:
    # On for the default/local profile: H2 is in-memory, so the seed has to
    # load on every start or there's nothing to see. The azure profile
    # overrides this back to false explicitly - see application-azure.yml.
    # See docs/data/README.md "Import behaviour" for why cloud stays off:
    # this app cold-starts often on a free-tier plan and free-tier DB, and an
    # import running on every cold start is pure waste once tables are populated.
    import-on-startup: true
    # When a target table already has rows, import skips it unless this is true.
    import-force: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.antar: INFO
