name: deploy

# Deploys the built jar to Azure App Service (Java SE, Linux, Free tier).
#
# Requires one repository secret:
#   AZURE_WEBAPP_PUBLISH_PROFILE  - App Service > Overview > Download publish profile
#
# And one repository variable:
#   AZURE_WEBAPP_NAME             - the App Service name

on:
  workflow_run:
    workflows: [ build ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package
        run: mvn -B clean package -DskipTests

      - name: Rename jar
        run: cp antar-api/target/antar-api-*.jar app.jar

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.jar
